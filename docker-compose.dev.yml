# ============================================
# DeepTutor Docker Compose - Development Override
# ============================================
# Use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This override file provides:
#   - Hot-reload for both frontend and backend
#   - Source code mounting for live editing
#   - Development-friendly logging
# ============================================

services:
  deeptutor:
    build:
      target: development

    volumes:
      # Mount backend source code for hot-reload
      - ./deeptutor:/app/deeptutor:ro
      - ./deeptutor_cli:/app/deeptutor_cli:ro
      - ./scripts:/app/scripts:ro

      # Mount frontend source for hot-reload
      - ./web/app:/app/web/app:ro
      - ./web/components:/app/web/components:ro
      - ./web/lib:/app/web/lib:ro
      - ./web/hooks:/app/web/hooks:ro
      - ./web/context:/app/web/context:ro
      - ./web/i18n:/app/web/i18n:ro
      - ./web/locales:/app/web/locales:ro
      - ./web/public:/app/web/public:ro

      # Mount frontend configs that the upstream Dockerfile's dev stage fails
      # to copy into the image:
      #   - tsconfig.json: without this, Next.js auto-creates an empty tsconfig
      #     and the "@/*" path alias silently stops working
      #   - tailwind.config.js / postcss.config.js: without these, `next dev`
      #     produces zero Tailwind CSS at runtime (production build baked these
      #     in already, so GHCR image works; dev target rebuilds from scratch)
      # Don't mount next.config.ts here — Next.js's config watcher treats
      # bind-mounted config as constantly-changing and restart-loops the server.
      - ./web/tsconfig.json:/app/web/tsconfig.json:ro
      - ./web/tailwind.config.js:/app/web/tailwind.config.js:ro
      - ./web/postcss.config.js:/app/web/postcss.config.js:ro

      # Mount data directories (writable) - output to local ./data
      - ./data/user:/app/data/user
      - ./data/knowledge_bases:/app/data/knowledge_bases

    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE=http://localhost:${BACKEND_PORT:-8001}

    # In development, we might want to see logs directly
    # Uncomment the following to disable log files and see everything in console
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"

    networks:
      - deeptutor-network
